<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素动效 · 原帧与主题预览</title><style>body{background:#edf1e5;color:#132a49;font:18px/1.8 system-ui;margin:24px}main{max-width:1280px;margin:auto}button,select{font:inherit;min-height:44px;margin:8px;padding:4px 12px}button:focus-visible{outline:3px solid #96620d}.scene{position:relative;width:100%;aspect-ratio:16/9;background:#143669 center/cover;border:3px solid #132a49;image-rendering:pixelated;overflow:hidden}.sprite{display:inline-block;flex:none;width:144px;height:96px;image-rendering:pixelated;background-repeat:no-repeat;vertical-align:middle}.scene>.sprite{position:absolute}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}article{background:#fff9e9;padding:18px;border:2px solid #32566e}code{font-size:14px}img{image-rendering:pixelated}p{margin:8px 0}.frames{overflow:auto;display:flex;gap:8px}.frame{flex:none;width:96px;height:64px;image-rendering:pixelated;background-repeat:no-repeat;background-color:#143669}@media(max-width:600px){body{margin:12px}.sprite{max-width:100%}}</style></head><body><main><h1>像素场景动效素材预览</h1><p>原创整数格SVG，8帧、250ms/帧、2秒一循环。逐帧重绘轮廓/像素高光，不移动整张背景。此页是素材预览，不是网站录屏。</p><label>主题 <select id="theme"><option value="campus">校园</option><option value="sky">蓝天白云</option><option value="forest">森林</option><option value="beach">海滩</option><option value="voyage">星海远航</option></select></label><button id="toggle">暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button><label><input type="checkbox" id="static">静态对照</label><p id="status"></p><div class="scene" id="scene"></div><h2>当前主题：背景、设备及模板关卡</h2><div class="grid" id="grid"></div></main><script type="module" src="preview.js"></script></body></html>
